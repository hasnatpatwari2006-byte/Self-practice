name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Fix Project Structure
        run: |
          mkdir -p app/src/main/java/com/selfpractice
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mv AndroidManifest.xml app/src/main/ || true
          mv MainActivity.java app/src/main/java/com/selfpractice/ || true
          mv activity_main.xml app/src/main/res/layout/ || true
          mv strings.xml app/src/main/res/values/ || true
          mv styles.xml app/src/main/res/values/ || true
      - name: Grant permission
        run: chmod +x gradlew
      - name: Build APK
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Self-Practice-APK
          path: app/build/outputs/apk/debug/app-debug.apk
